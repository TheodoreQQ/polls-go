services:
  db:
    image: postgres:15-alpine
    restart: always 
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: user
      POSTGRES_DB: polls_db
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
      
  
  adminer: 
    image: adminer
    restart: always
    ports:
      - 8081:8080

volumes:
  pgdata: